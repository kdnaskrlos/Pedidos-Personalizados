  const creador = orig ? orig.creadoPor : S.me.usuario;
  if (pr.admin || (pr.bloquear && (!orig || orig.creadoPor === S.me.usuario))) {
    // Sin denegados: lo ven todos los que tienen permiso para ese tipo. Con denegados: se guarda la lista de quienes sí pueden verlo.
    const den = F.denegados.filter(u => u !== S.me.usuario); // se le puede negar incluso a quien lo registró
    data.denegados = den; data.asignados = [];
    if (!den.length) { data.publico = true; data.lectores = [creador]; } // al desmarcar todos, vuelve a verse como antes
    else {
      const tipoK = F.tipo === "sublimacion" ? "verSublimacion" : "verPersonalizado";
      const pueden = Object.values(S.usuarios).filter(u => u.activo && (u.rol === "admin" || u[tipoK] === true) && !den.includes(u.usuario)).map(u => u.usuario);
      data.publico = false; data.lectores = [...new Set([...(den.includes(creador) ? [] : [creador]), S.me.usuario, ...pueden])];
    }
  }
  if (orig && !pr.admin) {
    // Avisar al administrador qué cambió un empleado
    const J = x => JSON.stringify(x === undefined ? null : x);
    const campos = [["Cliente", o => [o.cliente && o.cliente.nombre, o.cliente && o.cliente.telefono]], ["Diseño", o => o.tema], ["Estampado", o => o.servicio], ["Quién pone la prenda", o => o.prendaDe],
      ["Prendas", o => (o.items || []).map(i => [i.etiqueta, i.prenda, i.color, i.horma, i.talla, Number(i.cant) || 1, i.nombre || "", i.numero || ""])], ["Fecha de entrega", o => o.fechaEntrega],
      ["Precios", o => (o.items || []).map(i => precioDe(o, prKey(i)))], ["Pago", o => [num(o.abono), o.moneda]], ["Urgente", o => !!o.urgente], ["Referencias", o => o.imagenes || []], ["Nota", o => (o.nota || "").trim()]];
    const cambios = campos.filter(([, f]) => J(f(orig)) !== J(f(data))).map(([n]) => n);
    if (cambios.length) Object.assign(data, {revisar:true, revisarCambios:[...new Set([...(orig.revisar ? orig.revisarCambios || [] : []), ...cambios])], revisarPor:S.me.usuario, revisarEn:now});
  }
  const btn = $("#save", ov); btn.disabled = true;
  try {
    if (orig) await updateDoc(doc(S.db, "pedidos/" + orig._id), data);
    else {
      if (!pr.admin && data.lectores === undefined) Object.assign(data, {asignados:[], publico:true, lectores:[creador]});
      Object.assign(data, {tipo:F.tipo, codigo:await siguienteCodigo(F.tipo), creadoEn:now, creadoPor:creador, estado:"pendiente", avisado:false});
      delete data.editadoEn; delete data.editadoPor;
      await setDoc(doc(collection(S.db, "pedidos")), data);
    }
    // (los clientes ya no se guardan aparte: cada pedido lleva su propio nombre y teléfono)
    S.tab = F.tipo;
    if (F._nuevo) borrarBorrador();
    ov.close(); F = null;
    setView("pedidos"); render();
    toast("Guardado");
  } catch(e) { console.warn(e); btn.disabled = false; toast("No se pudo guardar: " + (e.code === "permission-denied" ? "no tienes permiso" : "revisa tu conexión"), true); }
}

/* ================= Detalle ================= */
function waLink(p, plantilla){
  const c = cfg(), t = totales(p), pz = {};
  (p.items || []).forEach(i => pz[i.prenda] = (pz[i.prenda] || 0) + (i.cant || 1));
  const resumen = Object.entries(pz).map(([k, n]) => `${n} ${k}`).join(", ");
  const msg = (plantilla || c.plantilla).replace(/\{cliente\}/g, (p.cliente.nombre || "").split(" ")[0]).replace(/\{negocio\}/g, c.negocio).replace(/\{codigo\}/g, p.codigo).replace(/\{resumen\}/g, resumen)
    .replace(/\{saldo\}/g, t.saldo > 0 ? money(t.saldo, p.moneda) : "ninguno, ¡ya está pagado!").replace(/\{total\}/g, money(t.total, p.moneda)).replace(/\{fecha\}/g, fmtDate(p.fechaEntrega));
  return `https://wa.me/${p.cliente.telefono}?text=${encodeURIComponent(msg)}`;
}
function resumenTexto(p){
  const t = totales(p);
  return [`*${TIPOS[p.tipo].label.toUpperCase()}* · ${p.codigo}${p.urgente ? " · 🔥 URGENTE" : ""}`, p.tema && `Tema: ${p.tema}`, p.servicio && `Tipo estampado: ${p.servicio}`, p.prendaDe === "cliente" && "Prenda: la trae el cliente",
    p.etiqueta && `Etiqueta: ${p.etiqueta}`, " ",
    ...(p.items || []).map(i => `• ${i.cant > 1 ? i.cant + "× " : ""}${itemLine(i)}${i.horma ? " (" + i.horma + ")" : ""}`), " ", p.nota && `Nota: ${p.nota}`,
    `Cliente: ${p.cliente.nombre}`, `WhatsApp: ${prettyPhone(p.cliente.telefono)}`, `Entrega: ${fmtDate(p.fechaEntrega)}`,
    ...Object.keys(prendasDe(p)).map(k => `Precio ${k}: ${money(precioDe(p, k), p.moneda)}`), `Total: ${money(t.total, p.moneda)}`, `Abono: ${money(t.abono, p.moneda)} · Saldo: ${money(t.saldo, p.moneda)}`, p.motivoSinAbono && `Sin abono: ${p.motivoSinAbono}`].filter(Boolean).join("\n").replace(/\n \n/g, "\n\n");
}
function tallyTable(p){
  const c = cfg().cat, order = [...c.tallasAdulto, ...c.tallasNino], g = {}, ts = new Set();
  (p.items || []).forEach(i => { const k = `${i.prenda} ${i.color}${i.horma ? " · " + i.horma : ""}`; g[k] = g[k] || {}; g[k][i.talla] = (g[k][i.talla] || 0) + (i.cant || 1); ts.add(i.talla); });
  const ix = t => order.indexOf(t) < 0 ? 999 : order.indexOf(t);
  const tl = [...ts].sort((a, b) => ix(a) - ix(b));
  return `<div class="gridwrap"><table class="tally"><thead><tr><th>Prenda</th>${tl.map(t => `<th>${esc(t)}</th>`).join("")}<th>Total</th></tr></thead><tbody>${Object.entries(g).map(([k, r]) => `<tr><td>${esc(k)}</td>${tl.map(t => `<td class="num">${r[t] || ""}</td>`).join("")}<td class="num"><b>${Object.values(r).reduce((a, b) => a + b, 0)}</b></td></tr>`).join("")}</tbody></table></div>`;
}
function openDetail(id){
  const p = S.pedidos[id]; if (!p) return;
  const T = TIPOS[p.tipo], t = totales(p), pr = perm(), est = p.estado || "pendiente";
  const fd = p.fechaEntrega ? parseYmd(p.fechaEntrega) : null;
  const fecha = fd ? `${DIAS[fd.getDay()][0].toUpperCase() + DIAS[fd.getDay()].slice(1)} ${fd.getDate()} de ${MESES[fd.getMonth()]}` : "Sin fecha";
  const due = dueShort(p);
  const estTxt = est === "pendiente" ? "En producción" : est === "listo" ? (p.avisado ? "Sin retirar" : "Listo") : "Entregado";
  const ini = (p.cliente.nombre || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();
  const extra = [...servsDe(p), p.tipo === "personalizado" ? (p.prendaDe === "cliente" ? "Prenda del cliente" : p.prendaDe === "tienda" ? "Prenda de la tienda" : "") : ""].filter(Boolean);
  const ov = modal(`
    <div class="mh pdh" style="--c:${T.c}">
      <button class="pdback" data-close aria-label="Volver">${I("back")}</button>
      <div class="pdt"><small>PEDIDO ${esc(p.codigo || "")}</small><h2>${T.label.toUpperCase()}</h2></div>
      <span class="pdst ${est}${est === "listo" && p.avisado ? " vio" : ""}">${estTxt}</span>
    </div>
    <div class="mb pdb">
      <div class="pdcard pddate ${due.c || "warn"}">
        <div class="pdcal"><small>${fd ? MESES[fd.getMonth()].slice(0, 3).toUpperCase() : "--"}</small><b>${fd ? fd.getDate() : "?"}</b></div>
        <div class="pdd"><small>Fecha de entrega</small><b>${esc(fecha)}</b>${due.t || p.urgente ? `<span class="pdrl">${due.t ? `<span class="pdrel">${esc(due.t)}</span>` : ""}${p.urgente ? `<span class="dw-urg">${I("alert")}Urgente</span>` : ""}</span>` : ""}</div>
      </div>
      <div class="pdcard pdcli">
        <div class="pdwho"><span class="pdav">${esc(ini)}</span><b>${esc(p.cliente.nombre)}</b></div>
        <a class="pdwa" href="https://wa.me/${esc(p.cliente.telefono)}" target="_blank" rel="noopener">${I("msg")}${esc(prettyPhone(p.cliente.telefono))}</a>
      </div>
      <div class="pdcard">
        <div class="pdtema">${esc(p.tema || "Sin nombre de diseño")}</div>
        ${extra.length ? `<div class="pdextra">${extra.map(x => `<span>${esc(x)}</span>`).join("")}</div>` : ""}
        <hr>
        <div class="pdrow"><span class="pdlbl">PRENDAS</span><span class="pdmut">${t.piezas} ${t.piezas === 1 ? "pieza" : "piezas"}</span></div>
        <ul class="pdit">${(p.items || []).map(i => { const sub = [i.talla ? "Talla " + i.talla : "", i.horma, i.etiqueta, i.nombre, i.numero ? "N° " + i.numero : ""].filter(Boolean); return `<li><span class="q num">${i.cant}</span><span class="d"><b>${esc(i.prenda)} ${esc(i.color.toLowerCase())}</b>${sub.length ? `<small>${esc(sub.join(" · "))}</small>` : ""}</span><span class="pr num">${esc(money((Number(i.cant) || 1) * precioDe(p, prKey(i)), p.moneda))}</span></li>`; }).join("")}</ul>
      </div>
      <div class="pdcard">
        <div class="pdrow"><span class="pdlbl ic">${I("cash")}PAGO</span></div>
        <hr>
        <div class="pdrow"><b class="pdtl">Total</b><b class="pdtot num">${esc(money(t.total, p.moneda))}</b></div>
        <div class="pdpay"><div class="ab"><small>ABONO</small><b class="num">${esc(money(t.abono, p.moneda))}</b></div><div class="sa ${t.saldo > 0 ? "" : "ok"}"><small>SALDO</small><b class="num">${esc(money(t.saldo, p.moneda))}</b></div></div>
        ${p.motivoSinAbono ? `<p class="pdmut"><b>Sin abono:</b> ${esc(p.motivoSinAbono)}</p>` : ""}
      </div>
      ${(p.imagenes || []).length ? `<div class="pdcard"><div class="pdlbl">REFERENCIAS</div><div class="imgs">${p.imagenes.map(im => `<div class="imgbox"><img data-foto="${esc(im)}" alt=""></div>`).join("")}</div></div>` : ""}
      ${p.nota ? `<div class="pdcard"><div class="pdlbl">NOTA</div><div class="pdnote">${esc(p.nota)}</div></div>` : ""}
      <p class="hist pdhist">Registrado: ${fmtDT(p.creadoEn)} por ${esc(nameOf(p.creadoPor))}${p.editadoEn ? `<br>Última edición: ${fmtDT(p.editadoEn)} por ${esc(nameOf(p.editadoPor))}` : ""}${p.listoEn ? `<br>Completado: ${fmtDT(p.listoEn)}` : ""}${p.avisadoEn ? `<br>Cliente avisado: ${fmtDT(p.avisadoEn)}` : ""}${p.entregadoEn ? `<br>Entregado: ${fmtDT(p.entregadoEn)}` : ""}${(p.asignados || []).length ? `<br>Visible solo para: ${esc(p.asignados.map(nameOf).join(", "))}` : ""}</p>
    </div>
    <div class="mf dfoot">
      <div class="drow2">
        ${est !== "pendiente" ? `<button class="btn" id="d-reab">${I("undo")}Reabrir</button>` : ""}
        ${pr.eliminar ? `<button class="btn danger" id="d-del">${I("trash")}Eliminar</button>` : ""}
        <button class="btn" id="d-edit">${I("edit")}Editar</button>
      </div>
      ${est === "pendiente" ? `<button class="btn pdlisto" id="d-listo">${I("check")}Marcar pedido listo</button>` : ""}
      ${est === "listo" ? `<div class="dgrid">${p.avisado ? `<a class="btn wa big" id="d-rec" href="${esc(waLink(p, cfg().plantillaRetiro))}" target="_blank" rel="noopener">${I("msg")}Recordar</a>` : `<a class="btn wa big" id="d-wa" href="${esc(waLink(p))}" target="_blank" rel="noopener">${I("msg")}Avisar al cliente</a>`}<button class="btn listo" id="d-ent">${I("box")}Entregado</button></div>` : ""}
    </div>`, "pdmd");
  loadFotos(ov);
  ov.querySelectorAll(".imgbox img").forEach(i => i.onclick = () => i.src && lightbox(i.src));
  const upd = async (data, msg) => { if (await cambiar(id, data, msg)) ov.close(); };
  const on = (s, fn) => { const b = $(s, ov); if (b) b.onclick = fn; };
  on("#d-edit", () => { ov.close(); openForm(id); });
  on("#d-listo", async () => {
    if (!await cambiar(id, {estado:"listo", listoEn:new Date().toISOString(), listoPor:S.me.usuario, avisado:false}, "Listo")) return;
    ov.close();
    popupListo(Object.assign({}, p, {estado:"listo"}));
  });
  on("#d-wa", () => { marcarAvisado(id); ov.close(); });
  on("#d-rec", () => { const n = new Date().toISOString(); cambiar(id, {avisadoEn:n, recordadoEn:n, posponerHasta:""}, "Recordado"); ov.close(); });
  on("#d-ent", () => upd({estado:"entregado", entregadoEn:new Date().toISOString()}, "Entregado"));
  on("#d-reab", () => upd({estado:"pendiente", avisado:false}, "Reabierto"));
  on("#d-del", () => confirmar(`¿Eliminar el pedido ${p.codigo}?`, "Podrás deshacerlo durante unos segundos.", "Eliminar", async () => { ov.close(); borrarPedido(p); }));
}
function popupListo(p){
  const nombre = (p.cliente.nombre || "").split(" ")[0];
  const pop = modal(`<div class="okpop">
      <div class="okic">${I("check")}</div>
      <h2>¡Pedido listo!</h2>
      <p>${esc(p.codigo)} · ${esc(p.cliente.nombre)}</p>
      <p class="note">Avísale a ${esc(nombre)} que ya puede retirarlo. El mensaje se escribe solo.</p>
      <a class="btn wa big" id="pw" href="${esc(waLink(p))}" target="_blank" rel="noopener">${I("msg")}Avisar ahora por WhatsApp</a>
      <button class="btn" data-close>Más tarde</button>
      <span class="note" style="font-size:12px">Si lo dejas para después, aparece en Avisos → Por avisar al cliente.</span>
    </div>`, "sm pop");
  $("#pw", pop).onclick = () => { marcarAvisado(p._id); pop.close(); };
}
async function marcarAvisado(id){
  cambiar(id, {avisado:true, avisadoEn:new Date().toISOString(), avisadoPor:S.me.usuario}, "Avisado", "Error al guardar");
}
/* ===== Sin autocompletado del navegador en ningún campo ===== */
function sinAutocompletar(root){
  (root.querySelectorAll ? root.querySelectorAll("input,textarea") : []).forEach(el => {
    if (el.dataset.noac) return; el.dataset.noac = "1";
    el.setAttribute("autocomplete", el.type === "password" ? "new-password" : "off");
    el.setAttribute("autocorrect", "off"); el.setAttribute("spellcheck", "false");
    if (el.tagName === "INPUT" && !el.name) el.name = "f" + Math.random().toString(36).slice(2, 8);
  });
}
new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => n.nodeType === 1 && sinAutocompletar(n.matches && n.matches("input,textarea") ? n.parentNode : n)))).observe(document.documentElement, {childList:true, subtree:true});
sinAutocompletar(document);
/* ===== Deshacer ===== */
function toastUndo(msg, onUndo, ms = 7000, onEnd){
  document.querySelectorAll(".toast").forEach(x => x.remove());
  const t = document.createElement("div"); t.className = "toast undo";
  t.innerHTML = `<span>${esc(msg)}</span><button type="button">${I("undo")}Deshacer</button><i style="animation-duration:${ms}ms"></i>`;
  document.body.appendChild(t);
  let done = false;
  const fin = () => { if (done) return; done = true; t.remove(); onEnd && onEnd(); };
  const tm = setTimeout(fin, ms);
  t.querySelector("button").onclick = async () => { if (done) return; done = true; clearTimeout(tm); t.remove(); try { await onUndo(); toast("Deshecho"); } catch(e) { toast("Error al deshacer", true); } };
  return fin;
}
// Cambia campos de un pedido y ofrece deshacer (vuelve a poner los valores anteriores)
async function cambiar(id, data, msg, errMsg = "Error al guardar"){
  const p = S.pedidos[id] || {}, prev = {};
  Object.keys(data).forEach(k => prev[k] = p[k] === undefined ? null : p[k]);
  try { await updateDoc(doc(S.db, "pedidos/" + id), data); }
  catch(e) { toast(errMsg, true); return false; }
  toastUndo(msg, () => updateDoc(doc(S.db, "pedidos/" + id), prev));
  return true;
}
// Eliminar con deshacer: el pedido se oculta y se borra de verdad al terminar el aviso
const BORRAR = {};
function borrarPedido(p){
  const id = p._id;
  const real = () => { if (!BORRAR[id]) return; delete BORRAR[id]; deleteDoc(doc(S.db, "pedidos/" + id)).then(() => { for (const im of (p.imagenes || [])) { deleteDoc(doc(S.db, "fotos/" + im)).catch(() => {}); deleteDoc(doc(S.db, "fotos/" + im + "_m")).catch(() => {}); } }).catch(() => { toast("Error al eliminar", true); S.remerge && S.remerge(); }); };
  BORRAR[id] = real; S.remerge && S.remerge();
  toastUndo("Eliminado", async () => { delete BORRAR[id]; S.remerge && S.remerge(); }, 7000, real);
}
addEventListener("pagehide", () => Object.values(BORRAR).forEach(f => f()));
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") Object.values(BORRAR).forEach(f => f()); });

boot();
</script>
